# Perfil Oracle DBDVP — activar con: spring.profiles.active=oracle
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: jdbc:oracle:thin:@${DB_HOST:192.168.29.66}:${DB_PORT:1521}/${DB_SERVICE:DBDVP}
    username: ${DB_USER:DIRGEN_OWNER}
    password: ${DB_PASSWORD:pruebas}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: DIRGEN_OWNER
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
