# Perfil Oracle DBDVP — activo cuando DB_ENGINE=oracle
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: jdbc:oracle:thin:@${DB_ORACLE_HOST:${DB_HOST:192.168.29.66}}:${DB_ORACLE_PORT:${DB_PORT:1521}}/${DB_ORACLE_SERVICE:${DB_SERVICE:DBDVP}}
    username: ${DB_ORACLE_USERNAME:${DB_USER:DIRGEN_USR}}
    password: ${DB_ORACLE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_ORACLE_DDL_AUTO:validate}
    show-sql: ${DB_ORACLE_SHOW_SQL:false}
    properties:
      hibernate:
        default_schema: ${DB_ORACLE_SCHEMA:DIRGEN_USR}
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
