# BaseSpringApi — configuración principal
# Motor: DB_ENGINE=oracle | mock (ver .env.example)

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}

spring:
  application:
    name: BaseSpringApi
  profiles:
    active: ${DB_ENGINE:oracle}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    mongo:
      enabled: false

app:
  data:
    json-path: classpath:data/unidades-medicas.json
  cors:
    allowed-origin-patterns:
      - http://localhost:4200
      - http://127.0.0.1:4200
      - http://localhost:8080
      - http://127.0.0.1:8080
      - http://192.168.*.*:4200
      - http://192.168.*.*:8080
      - http://10.*.*.*:4200
      - http://10.*.*.*:8080

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
